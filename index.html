<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobFinder | Remote Jobs</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="container navbar">

        <div class="logo">

            <i class="fa-solid fa-briefcase"></i>

            <span>JobFinder</span>

        </div>

        <nav>

            <a href="#">Home</a>

            <a href="#results">Jobs</a>

        </nav>

    </div>

</header>



<section class="hero">

    <div class="container">

        <h1>Find Your Next Remote Job</h1>

        <p>

            Search thousands of remote opportunities from companies around the world.

        </p>

        <div class="search-box">

            <input
                type="text"
                id="jobTitle"
                placeholder="Search jobs, companies or technologies..."
            >

            <button id="searchBtn">

                <i class="fa-solid fa-magnifying-glass"></i>

                Search Jobs

            </button>

        </div>

    </div>

</section>



<section class="controls">

    <div class="container controls-wrapper">

        <select id="employmentType">

            <option value="">Employment Type</option>

            <option value="full">Full Time</option>

            <option value="contract">Contract</option>

            <option value="freelance">Freelance</option>

            <option value="part">Part Time</option>

        </select>

        <select id="seniority">

            <option value="">Experience Level</option>

            <option value="junior">Junior</option>

            <option value="mid">Mid Level</option>

            <option value="senior">Senior</option>

            <option value="lead">Lead</option>

        </select>

        <select id="sortBy">

            <option value="newest">Newest</option>

            <option value="company">Company A-Z</option>

            <option value="salary_high">Highest Salary</option>

        </select>

        <button id="clearBtn">

            <i class="fa-solid fa-rotate-left"></i>

            Clear Filters

        </button>

    </div>

</section>



<section class="status">

    <div class="container">

        <div id="loading" class="loading hidden">

            <div class="spinner"></div>

            <p>Loading jobs...</p>

        </div>

        <div id="resultCount"></div>

    </div>

</section>



<main class="container">

    <section id="results" class="results">

    </section>

</main>



<section class="pagination">

    <button id="prevPage">

        <i class="fa-solid fa-angle-left"></i>

        Previous

    </button>

    <span id="pageNumber">

        Page 1

    </span>

    <button id="nextPage">

        Next

        <i class="fa-solid fa-angle-right"></i>

    </button>

</section>



<footer>

    <div class="container footer-content">

        <h3>JobFinder</h3>

        <p>

            Discover remote opportunities from companies worldwide.

        </p>

        <small>

            Powered by the Remote OK API

        </small>

    </div>

</footer>

<script src="script.js"></script>

</body>

</html>
